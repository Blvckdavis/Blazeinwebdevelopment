<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A recipe discovery app built with vanilla JavaScript and TheMealDB API. Search, filter by category, and view full recipes with ingredients.">
    <title>FlavorFind — Recipe Discovery</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ====== Recipe Detail Modal (Overlay) ====== -->
    <div id="recipe-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" hidden>
        <div class="modal-content glass-panel">
            <!-- Close Button -->
            <button id="modal-close-btn" class="modal-close" aria-label="Close recipe details">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <!-- Modal Header Image -->
            <div class="modal-image-wrapper">
                <img id="modal-image" class="modal-image" src="" alt="">
            </div>

            <!-- Modal Body -->
            <div class="modal-body">
                <h2 id="modal-title" class="modal-title"></h2>
                <div class="modal-meta">
                    <span id="modal-category" class="modal-tag"></span>
                    <span id="modal-area" class="modal-tag"></span>
                </div>

                <!-- Ingredients Section -->
                <section class="modal-section">
                    <h3 class="modal-section-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <path d="M16 10a4 4 0 0 1-8 0"></path>
                        </svg>
                        Ingredients
                    </h3>
                    <ul id="modal-ingredients" class="ingredients-list"></ul>
                </section>

                <!-- Instructions Section -->
                <section class="modal-section">
                    <h3 class="modal-section-title">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="8" y1="6" x2="21" y2="6"></line>
                            <line x1="8" y1="12" x2="21" y2="12"></line>
                            <line x1="8" y1="18" x2="21" y2="18"></line>
                            <line x1="3" y1="6" x2="3.01" y2="6"></line>
                            <line x1="3" y1="12" x2="3.01" y2="12"></line>
                            <line x1="3" y1="18" x2="3.01" y2="18"></line>
                        </svg>
                        Instructions
                    </h3>
                    <p id="modal-instructions" class="instructions-text"></p>
                </section>

                <!-- YouTube Link (if available) -->
                <a id="modal-youtube" class="youtube-link glass-element" href="" target="_blank" rel="noopener noreferrer" hidden>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polygon points="5 3 19 12 5 21 5 3"></polygon>
                    </svg>
                    Watch Video Tutorial
                </a>
            </div>
        </div>
    </div>

    <!-- ====== Main Application ====== -->
    <main class="app-wrapper">
        <div class="app-container">

            <!-- Header -->
            <header class="app-header">
                <h1 class="app-title">
                    <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
                        <line x1="6" y1="1" x2="6" y2="4"></line>
                        <line x1="10" y1="1" x2="10" y2="4"></line>
                        <line x1="14" y1="1" x2="14" y2="4"></line>
                    </svg>
                    FlavorFind
                </h1>
                <p class="app-subtitle">Discover delicious recipes from around the world.</p>
            </header>

            <!-- Search Bar -->
            <form id="search-form" class="search-bar" autocomplete="off">
                <input
                    type="text"
                    id="search-input"
                    class="search-input glass-element"
                    placeholder="Search for a recipe…"
                    aria-label="Search recipes"
                >
                <button type="submit" id="search-btn" class="search-button glass-element" aria-label="Search">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </form>

            <!-- Category Filter Buttons -->
            <nav class="filter-bar" aria-label="Recipe category filters">
                <button class="filter-btn active" data-category="all" id="filter-all">All</button>
                <button class="filter-btn" data-category="Beef" id="filter-beef">Beef</button>
                <button class="filter-btn" data-category="Chicken" id="filter-chicken">Chicken</button>
                <button class="filter-btn" data-category="Seafood" id="filter-seafood">Seafood</button>
                <button class="filter-btn" data-category="Vegetarian" id="filter-vegetarian">Vegetarian</button>
                <button class="filter-btn" data-category="Nigerian" id="filter-nigerian">Nigerian</button>
                <button class="filter-btn" data-category="Pasta" id="filter-pasta">Pasta</button>
            </nav>

            <!-- Loading Indicator -->
            <div id="loading" class="loading glass-element" hidden>
                <div class="spinner"></div>
                <p>Finding recipes…</p>
            </div>

            <!-- Error / Empty State -->
            <div id="error-state" class="error-state glass-element" role="alert" hidden>
                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <p id="error-text" class="error-text"></p>
            </div>

            <!-- Recipe Grid -->
            <section id="recipe-grid" class="recipe-grid" aria-label="Recipe results">
                <!-- Recipe cards are rendered dynamically by app.js -->
            </section>

        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Longe Ayomide David &middot; Powered by TheMealDB</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
