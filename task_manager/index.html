<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A sleek task management to-do list app built with vanilla JavaScript, featuring CRUD operations, localStorage persistence, and glassmorphism UI.">
    <title>TaskFlow — To-Do List Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="app-wrapper">
        <div class="app-container">

            <!-- App Header -->
            <header class="app-header">
                <div class="header-content">
                    <h1 class="app-title">
                        <svg class="title-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
                            <polyline points="22 4 12 14.01 9 11.01"></polyline>
                        </svg>
                        TaskFlow
                    </h1>
                    <p class="app-subtitle">Organize your day, one task at a time.</p>
                </div>
            </header>

            <!-- Task Stats Bar -->
            <section class="stats-bar glass-element" aria-label="Task statistics">
                <div class="stat-item">
                    <span class="stat-number" id="stat-total">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-number stat-active" id="stat-active">0</span>
                    <span class="stat-label">Active</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-number stat-done" id="stat-done">0</span>
                    <span class="stat-label">Done</span>
                </div>
            </section>

            <!-- Add Task Form -->
            <form id="task-form" class="task-form" autocomplete="off">
                <input
                    type="text"
                    id="task-input"
                    class="task-input glass-element"
                    placeholder="What needs to be done?"
                    required
                    maxlength="120"
                    aria-label="New task description"
                >
                <button type="submit" id="add-task-btn" class="add-button glass-element" aria-label="Add task">
                    <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </form>

            <!-- Filter Buttons -->
            <nav class="filter-bar" aria-label="Task filters">
                <button class="filter-btn active" id="filter-all" data-filter="all">All</button>
                <button class="filter-btn" id="filter-active" data-filter="active">Active</button>
                <button class="filter-btn" id="filter-completed" data-filter="completed">Completed</button>
            </nav>

            <!-- Task List -->
            <section class="task-list-wrapper glass-panel" aria-label="Task list">
                <ul id="task-list" class="task-list" role="list">
                    <!-- Task items are rendered dynamically by app.js -->
                </ul>

                <!-- Empty State -->
                <div id="empty-state" class="empty-state">
                    <svg class="empty-icon" xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <line x1="9" y1="9" x2="15" y2="15"></line>
                        <line x1="15" y1="9" x2="9" y2="15"></line>
                    </svg>
                    <p class="empty-text">No tasks yet</p>
                    <p class="empty-hint">Type above and press Enter to add one.</p>
                </div>
            </section>

            <!-- Clear Completed Button -->
            <button id="clear-completed-btn" class="clear-button glass-element" hidden>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="3 6 5 6 21 6"></polyline>
                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                </svg>
                Clear Completed
            </button>

        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 Longe Ayomide David &middot; Built with Vanilla JS</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
